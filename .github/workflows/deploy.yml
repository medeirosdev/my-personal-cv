name: Deploy CV site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate last-updated.json from cv.pdf history
        run: |
          DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d' -- cv.pdf)
          if [ -z "$DATE" ]; then
            DATE=$(date +'%Y-%m-%d')
          fi
          echo "{\"date\": \"$DATE\"}" > last-updated.json
          cat last-updated.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
